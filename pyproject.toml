[project]
name = "hub-apps-dev"
version = "0"
requires-python = ">=3.10"

[dependency-groups]
dev = [
  "pytest>=8", "ruff>=0.6", "beancount>=3.2,<4", "pyyaml>=6", "matplotlib>=3.8",
  "openpyxl>=3.1", "xlrd>=2.0", "pdfplumber>=0.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "deb: needs double-entry-generator on PATH",
  "cchub: needs cc-hub on PATH",
]

[tool.ruff]
line-length = 100
