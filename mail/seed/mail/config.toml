# Settings of the mail app. The agent edits this file; you can read and change it by hand.
# After a hand edit, check it with: uv run apps/mail/scripts/mk.py config check
#
# [settings] holds the rules for every mailbox. The agent adds a [mailboxes."<name>"] section
# for each mailbox; it may set important and delivery for that mailbox alone, and its
# muted_senders and notes add to the ones below.
#
# Times are not here: how often mail is checked and when the daily digest goes out are tasks in
# hub.toml (cc-hub cron set mail/poll "<cron>", cc-hub cron set mail/digest "<cron>").
# Passwords are not here either: they live in secrets/mail/, which git ignores.

[settings]
# What counts as important: one sentence the agent judges each new mail against.
important = "Mail I must reply to or act on myself, and mail about money or account security (bills, charges, sign-in alerts)."
# instant: important mail is pushed at once. digest: it waits for the daily digest.
delivery = "instant"
# Senders that are never pushed, only digested: an address (news@shop.example) or a whole
# domain (@ads.example).
muted_senders = []
# Corrections you gave in chat, one line each; the agent applies them when judging mail.
notes = []
